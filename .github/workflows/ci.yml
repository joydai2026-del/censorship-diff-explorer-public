name: CI

on:
  push:
  pull_request:
  schedule:
    # Every Monday 13:00 UTC. GitHub emails the repo owner if a scheduled run fails.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install from lockfile
        run: npm ci
      - name: Run all tests (engine, CLI, headless browser)
        # Uses only the sample snapshots in data/ (fixtures). No test touches the network.
        # The runner image ships Google Chrome; the browser tests drive it over DevTools.
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          echo "Using browser: $CHROME_PATH"
          npm test 2>&1 | tee test-output.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Fail if any test was skipped (browser tests must really run)
        run: |
          grep -E '^# (tests|pass|fail|skipped)' test-output.txt
          grep -qE '^# skipped 0$' test-output.txt
          grep -qE '^# fail 0$' test-output.txt
      - name: Built page data is up to date with the sample snapshots
        run: |
          npm run build
          git diff --exit-code -- web/data/

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download gitleaks release binary and verify checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
